[project]
name = "sempyt"
version = "0.1.0"
description = "Named-dimension tensors over PyTorch: Dim objects, layout algebra, semantic ops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sempyt"]

# hatchling discovers src/sempyt from the project name


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
